name: APK derle

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore: ['diag/**', 'js/diag/**', '.github/workflows/diagnose.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # .cs3 eklentilerini çalıştıran CloudStream kütüphanesinin sabitlenmiş sürümü.
  # Güncellemek için bu commit'i değiştirin.
  CS_REF: eb962b4fb7b1387b8de42ec58000cee0a01fe741

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Nuvio JS kütüphanelerini paketle ve test et
        working-directory: js
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: CloudStream kütüphanesini indir
        run: |
          git clone --filter=blob:none https://github.com/recloudstream/cloudstream.git cs
          git -C cs checkout "$CS_REF"

      - name: Player modülünü yerleştir
        run: |
          cp -r player cs/player
          printf '\ninclude(":player")\n' >> cs/settings.gradle.kts

      - uses: gradle/actions/setup-gradle@v4

      - name: APK derle
        working-directory: cs
        run: |
          set -o pipefail
          ./gradlew :player:assembleRelease --stacktrace 2>&1 | tee ../build.log

      - name: Hata günlüğünü build-log dalına yaz
        if: failure()
        run: |
          mkdir -p logout && grep -E "^e: |error:|What went wrong|FAILED" -A3 build.log | head -200 > logout/errors.txt || true
          tail -c 150000 build.log > logout/build-tail.log
          cd logout && git init -q && git checkout -q -b build-log
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -q -m "build log ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-log

      - name: APK'yı hazırla
        run: |
          mkdir -p out
          cp cs/player/build/outputs/apk/release/*.apk "out/RepoPlayer-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: RepoPlayer-apk
          path: out/*.apk

      - name: Sürüm yayınla
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: RepoPlayer ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*.apk
